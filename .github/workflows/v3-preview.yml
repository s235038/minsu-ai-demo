name: V3 automated checks and preview deploy
on:
  push:
    branches: [fix/v3-mvp-demo]
  pull_request:
    paths:
      - 'minsu_ai_v3.html'
      - 'tests/**'
      - 'package*.json'
      - 'playwright.config.cjs'
      - '.github/workflows/v3-preview.yml'
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: v3-demo
          path: minsu_ai_v3.html
  deploy-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/v3-mvp-demo'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency: github-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - run: |
          mkdir -p _site
          cp minsu_ai_v3.html _site/
          cp minsu_ai_v3.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
