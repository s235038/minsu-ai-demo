name: V3 archived browser checks
on:
  pull_request:
    paths:
      - 'minsu_ai_v3.html'
      - 'tests/**'
      - 'package*.json'
      - 'playwright.config.cjs'
      - '.github/workflows/v3-preview.yml'
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: hospitality-demo-html
          path: minsu_ai_v3.html
