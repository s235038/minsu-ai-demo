<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>民宿智慧客服｜示範版</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:#f4f6fa;margin:0;color:#202c3b}.app{max-width:680px;margin:auto;min-height:100vh;display:flex;flex-direction:column;background:white}header{padding:22px;background:#183a55;color:white}header small{opacity:.8}main{padding:18px;flex:1;overflow:auto}.bubble{padding:13px 16px;border-radius:15px;max-width:85%;margin:10px 0;line-height:1.6;background:#eaf1f6;white-space:pre-wrap}.me{background:#d8eee4;margin-left:auto}footer{padding:12px;border-top:1px solid #ddd}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}button{border:1px solid #9ab0c3;background:white;border-radius:22px;padding:9px 12px;color:#173a52}form{display:flex;gap:8px}input{flex:1;min-width:0;padding:13px;border:1px solid #bac6d0;border-radius:10px}form button{background:#183a55;color:white}details{background:#f0f4f7;padding:10px;margin-top:12px;border-radius:10px}textarea{width:95%;min-height:180px;margin-top:10px}p.note{font-size:12px;color:#627487}</style></head><body><div class="app"><header><strong>🏡 台東好宿｜智慧客服展示</strong><br><small>虛構民宿・測試資料・不接受實際訂房</small></header><main id="chat"><div class="bubble">您好！歡迎使用民宿客服示範版。您可以詢問入住、退房、停車、早餐、寵物或交通資訊。這是規則式測試版本，尚未串接生成式 AI。</div></main><footer><div class="chips" id="chips"></div><form id="form"><input id="q" placeholder="輸入問題，例如：幾點入住？" autocomplete="off" aria-label="輸入問題"><button>送出</button></form><details><summary>老闆管理區（示範用，無登入保護）</summary><p class="note">修改以下 JSON 問答後按儲存。只保存在這台裝置的瀏覽器中，不能放真實客人資料。</p><textarea id="editor"></textarea><button id="save" type="button">儲存問答</button><button id="reset" type="button">恢復示範資料</button></details><p class="note">示範版僅供功能驗證；答案為虛構資料。無法查證時請聯繫民宿，勿依此安排實際住宿。</p></footer></div><script>
const defaults=[{q:'入住時間',keys:['入住','check in','幾點進房'],a:'示範入住時間為下午 3:00 後。實際時間請以業者確認為準。'},{q:'退房時間',keys:['退房','check out'],a:'示範退房時間為上午 11:00 前。'},{q:'停車資訊',keys:['停車','車位'],a:'示範民宿附近有停車空間，但車位數與費用需由業者確認。'},{q:'早餐服務',keys:['早餐','早點'],a:'示範資料：早餐是否供應及收費方式，請直接詢問業者。'},{q:'寵物規定',keys:['寵物','狗','貓'],a:'是否可攜帶寵物需由業者確認，請勿自行假定。'},{q:'交通方式',keys:['交通','火車','接駁','車站'],a:'請提供出發地點給業者，以便確認交通方式。此示範版不提供即時路線。'}];
let faq;try{faq=JSON.parse(localStorage.getItem('minsu-demo-faq')||'null')||defaults}catch{faq=defaults}
const chat=document.getElementById('chat'),chips=document.getElementById('chips'),editor=document.getElementById('editor');function draw(){chips.replaceChildren();faq.forEach(x=>{const b=document.createElement('button');b.textContent=x.q;b.onclick=()=>ask(x.q);chips.appendChild(b)});editor.value=JSON.stringify(faq,null,2)}function bubble(s,me=false){const d=document.createElement('div');d.className='bubble'+(me?' me':'');d.textContent=s;chat.appendChild(d);d.scrollIntoView({block:'end',behavior:'smooth'})}function ask(s){s=s.trim().slice(0,300);if(!s)return;bubble(s,true);const item=faq.find(x=>x.q===s||x.keys.some(k=>s.toLowerCase().includes(k.toLowerCase())));bubble(item?item.a:'目前沒有這項資訊，請直接聯絡民宿人員確認。此版本不會自行編造答案。')}document.getElementById('form').onsubmit=e=>{e.preventDefault();ask(document.getElementById('q').value);document.getElementById('q').value=''};document.getElementById('save').onclick=()=>{try{const v=JSON.parse(editor.value);if(!Array.isArray(v)||!v.every(x=>typeof x.q==='string'&&Array.isArray(x.keys)&&typeof x.a==='string'))throw Error();faq=v;localStorage.setItem('minsu-demo-faq',JSON.stringify(v));draw();alert('已儲存於此裝置瀏覽器')}catch{alert('格式錯誤，請保持 q、keys、a 欄位')}};document.getElementById('reset').onclick=()=>{faq=defaults;localStorage.removeItem('minsu-demo-faq');draw()};draw();</script></body></html>
