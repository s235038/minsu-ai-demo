<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台東好宿 V3</title><style>body{margin:0;background:#f4f6fa;font:16px -apple-system,sans-serif;color:#203044}.app{max-width:700px;margin:auto;min-height:100vh;background:white}header{background:#183a55;color:white;padding:22px}main,footer{padding:18px}.bubble{background:#eaf1f6;padding:14px;border-radius:15px;white-space:pre-wrap;margin:12px 0;line-height:1.6}.me{background:#d8eee4;margin-left:15%}footer{border-top:1px solid #ddd}.chips{display:flex;overflow-x:auto;gap:7px;margin-bottom:12px}button{padding:10px 13px;border:1px solid #9ab0c3;border-radius:20px;background:white;flex-shrink:0}form{display:flex;gap:8px}input,textarea{box-sizing:border-box;width:100%;min-width:0;padding:12px;border:1px solid #bac6d0;border-radius:9px;font:inherit}form button,.primary{background:#183a55;color:white}details{background:#f0f4f7;padding:12px;margin-top:12px;border-radius:10px}label{display:block;margin:10px 0}textarea{min-height:65px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.note{font-size:12px;color:#627487}</style><div class="app"><header><b>🏡 台東好宿｜V3 智慧接待展示</b><p>虛構旅宿・規則式測試・不接受實際訂房</p></header><main id="chat"><div class="bubble">您好！可以一次問多個問題，例如：帶狗可以嗎？有停車嗎？晚上入住可以嗎？</div></main><footer><div class="chips" id="chips"></div><form id="form"><input id="q" placeholder="輸入旅客問題" maxlength="500"><button type="submit">送出</button></form><details><summary>📝 訂房需求整理</summary><div class="grid"><label>入住日期<input type="date" id="date"></label><label>晚數<input type="number" id="nights" min="1" value="1"></label><label>大人<input type="number" id="adults" min="1" value="2"></label><label>小孩<input type="number" id="children" min="0" value="0"></label></div><label>房型<input id="room" placeholder="例如四人房"></label><label>特殊需求<textarea id="needs"></textarea></label><button type="button" id="summary" class="primary">產生需求摘要</button><p class="note">不會送出訂單、查詢空房或收集資料。</p></details><details><summary>⚙️ 老闆管理區（無登入保護）</summary><p class="note">全是虛構資料，請勿輸入真實客戶資料。</p><div id="editor"></div><button id="save" type="button" class="primary">儲存問答</button><button id="reset" type="button">恢復示範資料</button><p id="status"></p></details><p class="note">本版不是生成式 AI；房價、空房、設施與政策請由業者確認。</p></footer></div><script>
"use strict";const defaults=[{"q":"入住時間","keys":["入住","進房","check in"],"a":"示範入住為下午 3 點後；晚到請先確認"},{"q":"退房時間","keys":["退房","check out"],"a":"示範退房為上午 11 點前"},{"q":"停車","keys":["停車","車位"],"a":"車位數量及費用請向業者確認"},{"q":"早餐","keys":["早餐","早點"],"a":"供應及費用請向業者確認"},{"q":"寵物","keys":["寵物","帶狗","狗狗","貓"],"a":"攜帶寵物與清潔費請向業者確認"},{"q":"交通","keys":["交通","車站","接駁","火車"],"a":"接駁及交通請向業者確認"},{"q":"房型","keys":["房型","雙人房","四人房"],"a":"請提供人數供業者推薦房型"},{"q":"兒童","keys":["小孩","兒童","孩子"],"a":"兒童計價與年齡限制請向業者確認"},{"q":"加床","keys":["加床","加人"],"a":"加床費用及可行性請向業者確認"},{"q":"房價","keys":["房價","多少錢","價格","報價"],"a":"沒有即時房價，請提供日期人數向業者詢價"},{"q":"空房","keys":["空房","有房","還有房"],"a":"沒有連接空房系統，請由業者確認"},{"q":"訂房","keys":["訂房","預訂","保留房"],"a":"可整理需求，但本版不能保留房間"},{"q":"訂金","keys":["訂金","付款","刷卡"],"a":"付款方式及帳號以業者正式通知為準"},{"q":"取消","keys":["取消","退款","改期"],"a":"請依訂房條款向業者確認"},{"q":"颱風","keys":["颱風","豪雨","下雨"],"a":"天候相關改期請向業者確認"},{"q":"發票","keys":["發票","收據","統編"],"a":"開立方式請向業者確認"},{"q":"電梯","keys":["電梯","樓梯","輪椅"],"a":"無障礙及電梯設備請向業者確認"},{"q":"洗衣","keys":["洗衣","烘衣"],"a":"洗衣設備及費用請向業者確認"},{"q":"網路","keys":["wifi","網路"],"a":"網路設備請向業者確認"},{"q":"空調","keys":["冷氣","暖氣"],"a":"空調設備依房型向業者確認"},{"q":"浴室","keys":["浴缸","浴室","毛巾"],"a":"衛浴及備品請向業者確認"},{"q":"廚房","keys":["廚房","冰箱","微波爐"],"a":"料理設備請向業者確認"},{"q":"嬰兒床","keys":["嬰兒床","澡盆"],"a":"嬰兒用品請向業者確認"},{"q":"寄放行李","keys":["寄放","行李"],"a":"行李寄放請向業者確認"},{"q":"自助入住","keys":["自助入住","門禁","鑰匙"],"a":"入住方式由業者正式通知"},{"q":"證件","keys":["身分證","護照","證件"],"a":"請勿在展示頁輸入證件資料"},{"q":"吸菸","keys":["吸菸","抽菸"],"a":"吸菸規定請向業者確認"},{"q":"噪音","keys":["噪音","派對","唱歌"],"a":"安靜時段請向業者確認"},{"q":"景點","keys":["景點","行程","去哪玩"],"a":"景點資訊請另行查證"},{"q":"餐飲","keys":["餐廳","美食","宵夜"],"a":"營業時間請自行確認"},{"q":"超商","keys":["超商","便利商店"],"a":"附近商店請以地圖確認"},{"q":"租車","keys":["租車","機車","腳踏車"],"a":"租車合作請向業者確認"},{"q":"包棟","keys":["包棟","團體"],"a":"包棟費用請向業者確認"},{"q":"烤肉","keys":["烤肉","bbq"],"a":"烤肉規定請向業者確認"},{"q":"安全","keys":["消防","逃生","安全"],"a":"消防與緊急資訊請向業者確認"},{"q":"人工","keys":["真人","人工","老闆"],"a":"請使用業者正式聯絡管道"}],key="minsu-v3-faq";let faq=defaults.map(x=>({...x}));try{const x=JSON.parse(localStorage.getItem(key)||"null");if(Array.isArray(x)&&x.length===defaults.length)faq=x}catch(e){}
const el=id=>document.getElementById(id),chat=el("chat");function bubble(t,me=false){const d=document.createElement("div");d.className="bubble"+(me?" me":"");d.textContent=t;chat.appendChild(d);try{d.scrollIntoView({block:"end"})}catch(e){chat.scrollTop=chat.scrollHeight}}
function ask(s){s=String(s||"").trim().slice(0,500);if(!s)return;bubble(s,true);const t=s.toLowerCase(),hits=faq.filter(x=>x.q.toLowerCase()===t||x.keys.some(k=>t.includes(k.toLowerCase())));bubble(hits.length?hits.map(x=>"【"+x.q+"】"+x.a).join("\n\n"):"目前沒有足夠資料，請向業者確認；不會自行編造答案。")}
el("form").addEventListener("submit",e=>{e.preventDefault();try{ask(el("q").value);el("q").value=""}catch(err){console.error(err);bubble("回覆失敗，請重新整理再試。")}});
function draw(){el("chips").replaceChildren();faq.slice(0,12).forEach(x=>{const b=document.createElement("button");b.textContent=x.q;b.type="button";b.onclick=()=>ask(x.q);el("chips").appendChild(b)});el("editor").replaceChildren();faq.forEach((x,i)=>{const l=document.createElement("label");l.textContent=x.q;const a=document.createElement("textarea");a.value=x.a;a.dataset.i=i;l.appendChild(a);el("editor").appendChild(l)})}
el("save").onclick=()=>{faq=faq.map((x,i)=>({...x,a:el("editor").querySelector('[data-i="'+i+'"]').value}));try{localStorage.setItem(key,JSON.stringify(faq));el("status").textContent="已儲存於此瀏覽器"}catch(e){el("status").textContent="已套用但無法永久儲存"}draw()};el("reset").onclick=()=>{faq=defaults.map(x=>({...x}));try{localStorage.removeItem(key)}catch(e){}draw();el("status").textContent="已恢復"};
el("summary").onclick=()=>{const v=id=>el(id).value.trim(),d=v("date"),n=Number(v("nights")),a=Number(v("adults")),c=Number(v("children"));if(!d||!Number.isInteger(n)||n<1||n>30||!Number.isInteger(a)||a<1||a>30||!Number.isInteger(c)||c<0||c>30){bubble("請先填寫有效日期、晚數與人數");return}bubble("【旅客需求摘要｜尚未訂房】\n日期："+d+"\n晚數："+n+"\n大人："+a+" 人，小孩："+c+" 人\n房型："+(v("room")||"未指定")+"\n特殊需求："+(v("needs")||"無")+"\n待業者確認：空房、價格及特殊需求。此摘要不會自動送出。")};draw();
</script>
